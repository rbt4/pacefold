name: Rebind private spatial API when ready

on:
  push:
    branches:
      - agent/pacefold-25-privacy-return

permissions:
  contents: write

jobs:
  rebind:
    if: "!contains(github.event.head_commit.message, '[private-spatial-ready]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/pacefold-25-privacy-return
          fetch-depth: 0
      - name: Apply spatial-ready rebinding
        run: node scripts/rebind-private-spatial-ready.cjs
      - name: Verify
        run: |
          node scripts/verify-canonical.cjs canonical
          node --check canonical/app/pacefold-v25-private.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canonical/app/pacefold-v25-private.js
          git diff --cached --quiet && exit 0
          git commit -m "Retry private spatial binding when ready [private-spatial-ready]"
          git push origin HEAD:agent/pacefold-25-privacy-return
