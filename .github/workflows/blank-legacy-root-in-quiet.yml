name: Blank legacy root in Quiet

on:
  push:
    branches:
      - agent/pacefold-25-privacy-return

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[quiet-legacy-root]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/pacefold-25-privacy-return
          fetch-depth: 0
      - name: Blank hidden legacy root in Quiet
        run: node scripts/blank-legacy-root-in-quiet.cjs
      - name: Verify
        run: |
          node scripts/verify-canonical.cjs canonical
          node --check canonical/app/pacefold-v25-private.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canonical/app/pacefold-v25-private.js
          git diff --cached --quiet && exit 0
          git commit -m "Blank hidden legacy workspace in Quiet [quiet-legacy-root]"
          git push origin HEAD:agent/pacefold-25-privacy-return
