name: Temporary Pacefold cache recovery

on:
  push:
    branches: [agent/pacefold-cache-recovery]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: agent/pacefold-cache-recovery
          fetch-depth: 0

      - name: Apply cache-safe surface recovery
        run: |
          python3 - <<'PY'
          from pathlib import Path

          inject_path = Path('enhancements/inject.mjs')
          source = inject_path.read_text(encoding='utf-8')

          version_line = "const VERSION='15.8.0';\n"
          revision_line = "const ASSET_REVISION='15.8.4';\n"
          if revision_line not in source:
              if source.count(version_line) != 1:
                  raise SystemExit('Unexpected Pacefold surface version declaration')
              source = source.replace(version_line, version_line + revision_line, 1)

          old_query = '?v=${VERSION}'
          if old_query in source:
              if source.count(old_query) != 6:
                  raise SystemExit(f'Expected six stale asset query markers, found {source.count(old_query)}')
              source = source.replace(old_query, '?v=${ASSET_REVISION}')

          old_activate = "self.addEventListener('activate',event=>event.waitUntil(self.clients.claim()));"
          recovery = """// BEGIN pacefold-cache-recovery-15.8.4
          self.addEventListener('activate',event=>event.waitUntil((async()=>{
            const staleAsset=/\\/pacefold-(?:hub(?:-guardian)?|resilience|integrated)\\.(?:js|css)$/i;
            for(const cacheName of await caches.keys()){
              const cache=await caches.open(cacheName);
              const requests=await cache.keys();
              const stale=requests.filter(request=>{const url=new URL(request.url);return staleAsset.test(url.pathname)&&url.searchParams.get('v')!=='15.8.4';});
              await Promise.all(stale.map(request=>cache.delete(request)));
            }
            await self.clients.claim();
          })()));
          // END pacefold-cache-recovery-15.8.4"""
          if 'BEGIN pacefold-cache-recovery-15.8.4' not in source:
              if source.count(old_activate) != 1:
                  raise SystemExit('Unexpected service-worker activation patch structure')
              source = source.replace(old_activate, recovery, 1)

          if source.count('ASSET_REVISION') != 7:
              raise SystemExit(f'Asset revision was not applied consistently: {source.count("ASSET_REVISION")} references')
          if source.count('BEGIN pacefold-cache-recovery-15.8.4') != 1:
              raise SystemExit('Cache recovery patch is not idempotent')
          inject_path.write_text(source, encoding='utf-8')

          Path('enhancements/VERSION').write_text('15.8.4\n', encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace('Surface version:\n\n`15.8.0`', 'Surface asset revision:\n\n`15.8.4`')
          readme = readme.replace('Pacefold 15.8.0 integrated surface over Pacefold core 15.2.2', 'Pacefold 15.8.4 cache-recovery surface over Pacefold core 15.2.2')
          recovery_note = """## 15.8.4 installed-app recovery

The 15.2.2 security release changed the generated enhancement scripts but retained the old `?v=15.8.0` asset URLs. An installed PWA could therefore reuse pre-hardening JavaScript under the new Trusted Types policy, causing widespread runtime failures that clean CI browsers did not reproduce. 15.8.4 gives every injected JavaScript and CSS asset a new cache revision and removes only stale Pacefold enhancement entries when the updated service worker activates. Core preferences, captures, notebook data and unrelated caches are not deleted.

"""
          if '## 15.8.4 installed-app recovery' not in readme:
              marker = '## Install\n'
              if marker not in readme:
                  raise SystemExit('README install section was not found')
              readme = readme.replace(marker, recovery_note + marker, 1)
          readme_path.write_text(readme, encoding='utf-8')

          Path('CACHE_RECOVERY_15_8_4.md').write_text("""# Pacefold 15.8.4 cache recovery

## Root cause

The core 15.2.2 release enabled strict Trusted Types and rewrote the generated enhancement scripts, but the injected script and stylesheet URLs still used the unchanged `15.8.0` query revision. Existing Edge/PWA installations could load older cached enhancement scripts against the new CSP. Fresh CI profiles passed because they had no stale asset cache.

## Repair

- Separate the stable 15.8 runtime contract from an asset revision of `15.8.4`.
- Emit all injected CSS and JavaScript URLs with `?v=15.8.4`.
- On service-worker activation, delete only stale Pacefold enhancement assets whose revision is not `15.8.4`.
- Preserve all Pacefold data, the verified core cache, and unrelated origin caches.

## Verification

The repair branch reconstructs the checksum-pinned core, builds it, injects the surface, checks all six revised asset URLs, confirms a single targeted recovery block in both workers, and then runs the repository's full PR validation suite.
""", encoding='utf-8')
          PY

      - name: Verify generated recovery build
        run: |
          node --check enhancements/inject.mjs
          rm -rf /tmp/pacefold-repair-release /tmp/pacefold-repair.zip
          cat release/pacefold-v15.zip.b64.part-* | base64 --decode > /tmp/pacefold-repair.zip
          echo "2fbb5c9b1df8369eddd4a7e1b791d60d6f58b1bf4d51665e288fb88ec9409d2b  /tmp/pacefold-repair.zip" | sha256sum -c -
          mkdir /tmp/pacefold-repair-release
          unzip -q /tmp/pacefold-repair.zip -d /tmp/pacefold-repair-release
          node /tmp/pacefold-repair-release/scripts/build.mjs /tmp/pacefold-repair-release
          node enhancements/inject.mjs /tmp/pacefold-repair-release
          test "$(grep -o '?v=15.8.4' /tmp/pacefold-repair-release/app/index.html | wc -l)" -eq 6
          test "$(grep -o 'BEGIN pacefold-cache-recovery-15.8.4' /tmp/pacefold-repair-release/service-worker.js | wc -l)" -eq 1
          test "$(grep -o 'BEGIN pacefold-cache-recovery-15.8.4' /tmp/pacefold-repair-release/app/service-worker.js | wc -l)" -eq 1
          grep -q "url.searchParams.get('v')!=='15.8.4'" /tmp/pacefold-repair-release/app/service-worker.js
          node --check /tmp/pacefold-repair-release/service-worker.js
          node --check /tmp/pacefold-repair-release/app/service-worker.js

      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-cache-repair.yml
          git add enhancements/inject.mjs enhancements/VERSION README.md CACHE_RECOVERY_15_8_4.md
          git commit -m "Repair installed Pacefold asset cache mismatch"
          git push origin HEAD:agent/pacefold-cache-recovery
