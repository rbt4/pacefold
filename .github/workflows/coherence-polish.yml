name: Pacefold 25 coherence polish

on:
  push:
    branches:
      - agent/pacefold-25-coherence

permissions:
  contents: write

jobs:
  polish:
    if: "!contains(github.event.head_commit.message, '[coherence-polish]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: agent/pacefold-25-coherence
          fetch-depth: 0
      - name: Apply visual polish
        run: node scripts/polish-coherence.cjs
      - name: Verify syntax and canonical contract
        run: |
          node scripts/verify-canonical.cjs canonical
          node --check scripts/v25-coherence-audit.cjs
      - name: Commit visual polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canonical/app/pacefold-v25-recovery.css scripts/v25-coherence-audit.cjs
          git diff --cached --quiet && exit 0
          git commit -m "Polish Pacefold 25 clock canvas [coherence-polish]"
          git push origin HEAD:agent/pacefold-25-coherence
