name: Fix private Daybook stacking

on:
  push:
    branches:
      - agent/pacefold-25-privacy-return

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[daybook-stack]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/pacefold-25-privacy-return
          fetch-depth: 0
      - name: Apply stacking correction
        run: node scripts/fix-private-daybook-stack.cjs
      - name: Verify canonical source
        run: node scripts/verify-canonical.cjs canonical
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canonical/app/pacefold-v25-private.css
          git diff --cached --quiet && exit 0
          git commit -m "Fix private Daybook hit area [daybook-stack]"
          git push origin HEAD:agent/pacefold-25-privacy-return
