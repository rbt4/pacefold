name: Apply Pacefold 21.3.1 mobile composition correction

on:
  push:
    branches: [agent/pacefold-21-3-1-visual-hotfix]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/pacefold-21-3-1-visual-hotfix
          fetch-depth: 0
      - run: node enhancements/apply-21-3-1-mobile-composition-fix.cjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Pacefold 21.3.1 mobile composition"
          git push origin HEAD:agent/pacefold-21-3-1-visual-hotfix
