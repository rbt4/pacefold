name: Apply Pacefold 25 coherence correction

on:
  push:
    branches: [agent/pacefold-25-coherence]

permissions:
  contents: write

jobs:
  correct:
    if: ${{ !contains(github.event.head_commit.message, '[coherence]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout coherence branch
        uses: actions/checkout@v6
        with:
          ref: agent/pacefold-25-coherence
          fetch-depth: 0

      - name: Correct the V25 home composition
        run: |
          python3 - <<'PY'
          from pathlib import Path
          css=Path('canonical/app/pacefold-v25-recovery.css')
          source=css.read_text()
          marker='/* Pacefold 25 coherence r1 — one clock surface, one spatial navigation model, one folding Daybook. */'
          if marker not in source:
              source += r'''

/* Pacefold 25 coherence r1 — one clock surface, one spatial navigation model, one folding Daybook. */
.pf25Spatial-spatial-root[data-recovery="recovery-r2"]::before{display:none!important}
.pf25Spatial-spatial-root[data-recovery="recovery-r2"]{background:radial-gradient(circle at 74% 9%,rgba(222,172,92,.12),transparent 24%),radial-gradient(circle at 18% 88%,rgba(86,134,113,.09),transparent 30%),linear-gradient(145deg,#f4f5f0,#e9eee8 58%,#eef1eb)!important}
