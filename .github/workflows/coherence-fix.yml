              css.write_text(source)

          js=Path('canonical/app/pacefold-v25-recovery.js')
          source=js.read_text()
          needle="root.dataset.release=RELEASE;root.dataset.recovery=REVISION}"
          replacement="root.dataset.release=RELEASE;root.dataset.recovery=REVISION;root.dataset.coherence='coherence-r1'}"
          if "dataset.coherence='coherence-r1'" not in source:
              if needle not in source: raise SystemExit('recovery version anchor missing')
              source=source.replace(needle,replacement)
              js.write_text(source)
          PY

      - name: Add geometry and visual-contract audit
