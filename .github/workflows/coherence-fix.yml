          'use strict';
          const fs=require('node:fs'),http=require('node:http'),path=require('node:path');
          const {chromium}=require('playwright');
          const site=path.resolve(process.argv[2]||'canonical'),artifacts=path.resolve(process.argv[3]||'v25-audit-artifacts');
          const assert=(value,message)=>{if(!value)throw new Error(message)};
          function serve(){return new Promise(resolve=>{const server=http.createServer((req,res)=>{let pathname;try{pathname=decodeURIComponent(new URL(req.url,'http://127.0.0.1').pathname)}catch{pathname='/'}let file=path.join(site,pathname.replace(/^\/+/,''));if(pathname.endsWith('/'))file=path.join(file,'index.html');fs.readFile(file,(error,data)=>{if(error){res.writeHead(404);res.end();return}const type={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.css':'text/css; charset=utf-8','.png':'image/png','.svg':'image/svg+xml','.webmanifest':'application/manifest+json'}[path.extname(file)]||'application/octet-stream';res.writeHead(200,{'content-type':type,'cache-control':'no-store'});res.end(data)})});server.listen(0,'127.0.0.1',()=>resolve({server,origin:`http://127.0.0.1:${server.address().port}`}))})}
          function seed(){const d=new Date(),today=new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10),week={};for(let day=0;day<7;day+=1)week[day]={start:'08:30',end:'16:30',type:day===0||day===6?'off':'desk'};localStorage.setItem('pacefoldOnboardedV15','1');localStorage.setItem('pacefoldSetupDismissedV15','1');localStorage.setItem('pacefoldPrefsV15',JSON.stringify({profile:'original',lat:43.6205,lng:-79.5132,locationLabel:'Etobicoke, Toronto',timeZone:'America/Toronto',method:'15',asr:'hanafi',showSeconds:true,waterTarget:24,waterSips:2,waterDate:today,workHours:'08:30-16:30',workWeek:week,todayOverride:{date:today,type:'half'},noodleMinutes:30,lunchMode:'desk',notifications:false,quietMode:false,taskbarBadge:true,taskbarBadgeMode:'due'}))}
          const rounded=value=>Math.round(value*10)/10;
          async function snapshot(page){return page.evaluate(()=>{const rect=selector=>{const node=document.querySelector(selector);if(!node)return null;const r=node.getBoundingClientRect();return{x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom,display:getComputedStyle(node).display,position:getComputedStyle(node).position}};const rows=selector=>[...document.querySelectorAll(selector)].map(node=>Math.round(node.getBoundingClientRect().y));return{vw:innerWidth,vh:innerHeight,overflow:document.documentElement.scrollWidth-innerWidth,root:document.getElementById('pf25Spatial-spatial-root')?.dataset.coherence,outer:getComputedStyle(document.getElementById('pf25Spatial-spatial-root'),'::before').display,hero:rect('.pf25Spatial-clock-hero'),instrument:rect('#pf25Surface-instrument'),dial:rect('#pf25Surface-dial'),copy:rect('.pf25Surface-clock-copy'),status:rect('.pf25Surface-clock-copy .pf25Spatial-status'),day:rect('#pf25-dayline'),rhythm:rect('#pf25-rhythm'),rhythmRows:rows('#pf25-rhythm .pf25-rhythm-item'),dock:rect('#pf25Actions-action-dock'),actionHead:rect('#pf25Actions-action-dock .pf25Actions-action-head'),actionRows:rows('#pf25Actions-action-dock .pf25Actions-action'),tray:rect('#pf25Surface-fold-tray'),tabs:rect('#pf25Surface-fold-tray .pf25Surface-fold-tabs'),dots:rect('.pf25Spatial-mode-dots'),edgeFont:getComputedStyle(document.querySelector('.pf25Spatial-edge')).fontSize,critical:[...document.querySelectorAll('#pf25Surface-instrument,#pf25-dayline,#pf25-rhythm,#pf25Actions-action-dock,#pf25Surface-fold-tray')].map(node=>{const r=node.getBoundingClientRect();return{left:r.left,right:r.right,top:r.top,bottom:r.bottom}})}})}
          function inWidth(state){return state.critical.every(r=>r.left>=-1&&r.right<=state.vw+1)}
          async function main(){fs.mkdirSync(artifacts,{recursive:true});const {server,origin}=await serve(),browser=await chromium.launch({headless:true});try{
            const desktop=await browser.newContext({viewport:{width:1440,height:1000},timezoneId:'America/Toronto'}),page=await desktop.newPage();await page.addInitScript(seed);await page.goto(`${origin}/app/`,{waitUntil:'networkidle'});await page.waitForSelector('#pf25Spatial-spatial-root[data-coherence="coherence-r1"]',{timeout:15000});await page.waitForSelector('#pf25-rhythm .pf25-rhythm-item');let state=await snapshot(page);console.log('Pacefold coherence desktop:',JSON.stringify(state));
            assert(state.overflow<=1,'Desktop document overflows horizontally');assert(state.outer==='none','Decorative outer frame still competes with the clock');assert(state.status.display==='none','Verbose overdue status still competes with the quiet home rhythm');assert(state.actionHead.display==='none','Quick actions still render as a dashboard header');assert(state.dots.display==='none','Duplicate mode-dot navigation is still visible');assert(state.edgeFont==='0px','Spatial edge labels still crowd the canvas');assert(state.tray.position==='fixed'&&state.tray.h<70,'Closed Daybook is not a compact bottom spine');assert(new Set(state.rhythmRows).size===1,'Desktop prayer rhythm is not one calm row');assert(new Set(state.actionRows).size===1,'Desktop quick actions are not one calm row');assert(inWidth(state),'Desktop critical home elements escape the viewport');
            const closedHeight=state.tray.h;await page.click('#pf25-daybook-toggle');await page.waitForTimeout(180);state=await snapshot(page);assert(state.tray.h>closedHeight+80,'Daybook does not unfold upward into a usable notebook');assert(state.tabs.display!=='none','Daybook shortcuts stay hidden after opening');await page.click('#pf25-daybook-toggle');await page.screenshot({path:path.join(artifacts,'pacefold-25-coherence-home.png'),fullPage:false});await desktop.close();
            const mobile=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,timezoneId:'America/Toronto'}),m=await mobile.newPage();await m.addInitScript(seed);await m.goto(`${origin}/app/`,{waitUntil:'networkidle'});await m.waitForSelector('#pf25Spatial-spatial-root[data-coherence="coherence-r1"]',{timeout:15000});await m.waitForSelector('#pf25-rhythm .pf25-rhythm-item');const ms=await snapshot(m);console.log('Pacefold coherence mobile:',JSON.stringify(ms));assert(ms.overflow<=1,'Mobile document overflows horizontally');assert(inWidth(ms),'Mobile critical home elements escape the viewport');assert(new Set(ms.rhythmRows).size===2,'Mobile prayer times are not a contained 3×2 grid');assert(new Set(ms.actionRows).size===2,'Mobile quick actions are not a contained 3×2 grid');assert(Math.abs((ms.dial.y+ms.dial.h/2)-(ms.copy.y+ms.copy.h/2))<80,'Mobile analog and digital clock are not composed as one instrument');assert(ms.tray.left>=-1&&ms.tray.right<=ms.vw+1&&ms.tray.bottom<=ms.vh+1,'Mobile Daybook spine is clipped');for(const selector of ['#pf25-rhythm .pf25-rhythm-item','#pf25Actions-action-dock .pf25Actions-action']){const ok=await m.locator(selector).evaluateAll(nodes=>nodes.every(node=>{const r=node.getBoundingClientRect();return r.left>=-1&&r.right<=innerWidth+1}));assert(ok,`${selector} contains off-canvas items`)}await m.screenshot({path:path.join(artifacts,'pacefold-25-coherence-mobile.png'),fullPage:false});await mobile.close();
            console.log('Pacefold 25 coherence audit passed: one clock canvas, contained prayer/action grids, compact folding Daybook and no duplicate navigation.');
          }finally{await browser.close();server.close()}}
          main().catch(error=>{console.error(error.stack||error);process.exitCode=1});
          EOF
          node --check scripts/v25-coherence-audit.cjs

      - name: Strengthen canonical coherence guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/verify-canonical.cjs');s=p.read_text()
          anchor="if(!appHtml.includes('pacefold-v25-engine.js'))fail('Canonical engine is not active');"
          addition="if(!fs.readFileSync(path.join(root,'app/pacefold-v25-recovery.css'),'utf8').includes('Pacefold 25 coherence r1'))fail('Coherence CSS contract is missing');\nif(!fs.readFileSync(path.join(root,'app/pacefold-v25-recovery.js'),'utf8').includes(\"coherence-r1\"))fail('Coherence runtime marker is missing');\n"
          if 'Coherence CSS contract is missing' not in s:
              if anchor not in s: raise SystemExit('canonical guard anchor missing')
              s=s.replace(anchor,addition+anchor)
              p.write_text(s)
          PY
          node scripts/verify-canonical.cjs canonical
          node --check canonical/app/pacefold-v25-recovery.js

