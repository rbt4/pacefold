name: Update V25 audit private hook

on:
  push:
    branches:
      - agent/pacefold-25-privacy-return

permissions:
  contents: write

jobs:
  update:
    if: "!contains(github.event.head_commit.message, '[audit-private-hook]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/pacefold-25-privacy-return
          fetch-depth: 0
      - name: Update legacy audit hook
        run: node scripts/update-v25-audit-private-hook.cjs
      - name: Verify
        run: node --check scripts/v25-audit.cjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/v25-audit.cjs
          git diff --cached --quiet && exit 0
          git commit -m "Adapt legacy Daybook audit hook [audit-private-hook]"
          git push origin HEAD:agent/pacefold-25-privacy-return
