name: Finish private Daybook ownership

on:
  push:
    branches:
      - agent/pacefold-25-privacy-return

permissions:
  contents: write

jobs:
  finish:
    if: "!contains(github.event.head_commit.message, '[daybook-owner]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/pacefold-25-privacy-return
          fetch-depth: 0
      - name: Apply ownership correction
        run: node scripts/finish-private-daybook-ownership.cjs
      - name: Verify
        run: |
          node scripts/verify-canonical.cjs canonical
          node --check canonical/app/pacefold-v25-private.js
          node --check scripts/v25-audit.cjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canonical/app/pacefold-v25-private.js scripts/v25-audit.cjs
          git diff --cached --quiet && exit 0
          git commit -m "Give private Daybook one state owner [daybook-owner]"
          git push origin HEAD:agent/pacefold-25-privacy-return
