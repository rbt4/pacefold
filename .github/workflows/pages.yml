name: Validate and deploy Pacefold 21.2.0

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reconstruct current and previous verified releases
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          cat release/pacefold-v15.zip.b64.part-* | base64 --decode > /tmp/pacefold-v15.zip
          echo "2fbb5c9b1df8369eddd4a7e1b791d60d6f58b1bf4d51665e288fb88ec9409d2b  /tmp/pacefold-v15.zip" | sha256sum -c -
          mkdir _release _previous
          unzip -q /tmp/pacefold-v15.zip -d _release
          base_sha="$PR_BASE_SHA"
          if [ -z "$base_sha" ] || [ "$base_sha" = "null" ]; then base_sha="$PUSH_BEFORE_SHA"; fi
          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then base_sha=$(git rev-parse HEAD^); fi
          git ls-tree -r --name-only "$base_sha" release | grep '\.zip\.b64\.part-' | sort > /tmp/previous-parts.txt
          test -s /tmp/previous-parts.txt
          while IFS= read -r part; do git show "${base_sha}:${part}"; done < /tmp/previous-parts.txt | base64 --decode > /tmp/pacefold-previous.zip
          unzip -q /tmp/pacefold-previous.zip -d _previous
          current_core=$(sed -n "s/.*const APP_VERSION='\([^']*\)'.*/\1/p" _release/app/app.js | head -n 1)
          previous_core=$(sed -n "s/.*const APP_VERSION='\([^']*\)'.*/\1/p" _previous/app/app.js | head -n 1)
          current_surface=$(cat enhancements/VERSION)
          previous_surface=$(git show "${base_sha}:enhancements/VERSION" 2>/dev/null || true)
          test -n "$current_core"
          test -n "$previous_core"
          test "$current_surface" = "21.2.0"
          if [ "$current_core" = "$previous_core" ]; then
            test "$current_surface" != "$previous_surface"
            echo "Surface version advanced: ${previous_surface:-none} -> $current_surface; core remains $current_core"
          else
            echo "Core version advanced: $previous_core -> $current_core; surface $current_surface"
          fi

      - name: Source syntax and security guard
        run: |
          for file in \
            enhancements/pacefold-hub.js \
            enhancements/pacefold-hub-guardian.js \
            enhancements/pacefold-resilience.js \
            enhancements/pacefold-integrated.js \
            enhancements/pacefold-theme-boot.js \
            enhancements/pacefold-ma.js \
            enhancements/pacefold-v19.js \
            enhancements/pacefold-v20.js \
            enhancements/pacefold-v21-boot.js \
            enhancements/pacefold-v21.js \
            enhancements/pacefold-v21-persistence.js \
            enhancements/pacefold-v21-refine.js \
            enhancements/pacefold-v21-precision.js \
            enhancements/inject.mjs \
            enhancements/hub-audit.cjs \
            enhancements/run-hub-audit.cjs \
            enhancements/resilience-audit.cjs \
            enhancements/integrated-audit.cjs \
            enhancements/ma-audit.cjs \
            enhancements/v19-audit.cjs \
            enhancements/v20-audit.cjs \
            enhancements/v21-audit.cjs \
            enhancements/patch-core-audit.cjs; do node --check "$file"; done
          test "$(cat enhancements/VERSION)" = "21.2.0"
          test "$(stat -c %s enhancements/fonts/pacefold-ma.woff2)" -le 15000
          grep -q 'pf-v21-minimal-active' enhancements/pacefold-v21-minimal.css
          grep -q -- '--pf22-surface' enhancements/pacefold-v21-minimal.css
          grep -q 'flex-wrap:wrap' enhancements/pacefold-v21-minimal-responsive.css
          grep -q 'data-pf21-weather="false"' enhancements/pacefold-v21-minimal-responsive.css
          grep -q "const EXPERIENCE='21.2.0'" enhancements/pacefold-v21-precision.js
          grep -q "const RELEASE='21.2.0'" enhancements/pacefold-v21-refine.js
          grep -q "const REVISION='minimal-r1'" enhancements/pacefold-v21-precision.js
          ! grep -P '[\x{3040}-\x{30ff}\x{3400}-\x{9fff}]' enhancements/pacefold-v21-minimal.css enhancements/pacefold-v21-minimal-responsive.css enhancements/pacefold-v21-precision.js
          ! grep -E -q '\.innerHTML[[:space:]]*=' enhancements/pacefold-v21-precision.js

      - name: Build verified core
        run: |
          PACEFOLD_DEBUG=1 node _release/scripts/build.mjs _release
          node _release/scripts/validate.mjs _release

      - name: Install browser audit runtime
        run: |
          npm install --prefix /tmp/pacefold-browser-audit playwright@1.61.1
          /tmp/pacefold-browser-audit/node_modules/.bin/playwright install --with-deps chromium

      - name: Browser application and installed-upgrade audit
        run: |
          node enhancements/patch-core-audit.cjs _release/scripts/browser-audit.cjs
          node --check _release/scripts/browser-audit.cjs
          timeout 240s env NODE_PATH=/tmp/pacefold-browser-audit/node_modules node _release/scripts/browser-audit.cjs _release _previous

      - name: Inject and audit Pacefold 21.2 surface
        run: |
          node enhancements/inject.mjs _release
          node enhancements/inject.mjs _release
          test "$(cat _release/pacefold-hub-version.txt)" = "15.8.0"
          test "$(cat _release/pacefold-experience.txt)" = "21.2.0"
          test "$(grep -o 'data-pacefold-v21="21.2.0"' _release/app/index.html | wc -l)" -eq 2
          test "$(grep -o 'data-pacefold-v21-boot="21.2.0"' _release/app/index.html | wc -l)" -eq 1
          test "$(grep -o 'data-pacefold-v21-persistence="21.2.0"' _release/app/index.html | wc -l)" -eq 1
          test "$(grep -o 'data-pacefold-v21-refine="21.2.0"' _release/app/index.html | wc -l)" -eq 2
          test "$(grep -o 'data-pacefold-v21-precision="21.2.0"' _release/app/index.html | wc -l)" -eq 2
          test "$(grep -o 'data-pacefold-v21-minimal="21.2.0"' _release/app/index.html | wc -l)" -eq 1
          test "$(grep -o 'data-pacefold-v21-minimal-responsive="21.2.0"' _release/app/index.html | wc -l)" -eq 1
          test -f _release/app/pacefold-v21-minimal.css
          test -f _release/app/pacefold-v21-minimal-responsive.css
          grep -q 'pacefold-v21-minimal.css' _release/service-worker.js
          grep -q 'pacefold-v21-minimal-responsive.css' _release/service-worker.js
          grep -q 'pacefold-v21-minimal-responsive.css' _release/app/service-worker.js
          grep -q 'revision:21.2.0' _release/service-worker.js
          ! grep -q 'https://graph.microsoft.com' _release/app/index.html
          ! grep -q 'allow-popups-to-escape-sandbox' _release/app/pacefold-hub.js
          grep -Fq 'caches.match(request,{ignoreSearch:true})' _release/service-worker.js
          node --check _release/app/pacefold-v21.js
          node --check _release/app/pacefold-v21-persistence.js
          node --check _release/app/pacefold-v21-refine.js
          node --check _release/app/pacefold-v21-precision.js
          node --check _release/service-worker.js
          node --check _release/app/service-worker.js

      - name: Notebook and integration browser audit
        run: |
          mkdir -p /tmp/pacefold-audits
          set -o pipefail
          timeout 180s env NODE_PATH=/tmp/pacefold-browser-audit/node_modules node enhancements/run-hub-audit.cjs _release 2>&1 | tee /tmp/pacefold-audits/notebook.log

      - name: Destructive resilience browser audit
        run: |
          set -o pipefail
          timeout 180s env NODE_PATH=/tmp/pacefold-browser-audit/node_modules node enhancements/resilience-audit.cjs _release 2>&1 | tee /tmp/pacefold-audits/resilience.log

      - name: Integrated dock and taskbar browser audit
        run: |
          mkdir -p /tmp/pacefold-audits/integrated
          set -o pipefail
          timeout 180s env NODE_PATH=/tmp/pacefold-browser-audit/node_modules node enhancements/integrated-audit.cjs _release /tmp/pacefold-audits/integrated 2>&1 | tee /tmp/pacefold-audits/integrated.log

      - name: Ma release browser audit
        run: |
          mkdir -p /tmp/pacefold-audits/ma
          set -o pipefail
          timeout 180s env NODE_PATH=/tmp/pacefold-browser-audit/node_modules node enhancements/ma-audit.cjs _release /tmp/pacefold-audits/ma 2>&1 | tee /tmp/pacefold-audits/ma.log

      - name: V19 dashboard browser audit
        run: |
          mkdir -p /tmp/pacefold-audits/v19
          set -o pipefail
          timeout 180s env NODE_PATH=/tmp/pacefold-browser-audit/node_modules node enhancements/v19-audit.cjs _release /tmp/pacefold-audits/v19 2>&1 | tee /tmp/pacefold-audits/v19.log

      - name: V20 visual, taskbar and backup browser audit
        run: |
          mkdir -p /tmp/pacefold-audits/v20
          set -o pipefail
          timeout 180s env NODE_PATH=/tmp/pacefold-browser-audit/node_modules node enhancements/v20-audit.cjs _release /tmp/pacefold-audits/v20 2>&1 | tee /tmp/pacefold-audits/v20.log

      - name: Pacefold 21.2 minimal browser audit
        run: |
          mkdir -p /tmp/pacefold-audits/v21
          set -o pipefail
          timeout 180s env NODE_PATH=/tmp/pacefold-browser-audit/node_modules node enhancements/v21-audit.cjs _release /tmp/pacefold-audits/v21 2>&1 | tee /tmp/pacefold-audits/v21.log

      - name: Upload browser diagnostics and visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pacefold-21.2-audit-${{ github.run_id }}
          path: /tmp/pacefold-audits/
          if-no-files-found: warn
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build verified site
        run: |
          cat release/pacefold-v15.zip.b64.part-* | base64 --decode > /tmp/pacefold-v15.zip
          echo "2fbb5c9b1df8369eddd4a7e1b791d60d6f58b1bf4d51665e288fb88ec9409d2b  /tmp/pacefold-v15.zip" | sha256sum -c -
          mkdir _release _site
          unzip -q /tmp/pacefold-v15.zip -d _release
          node _release/scripts/build.mjs _release
          node _release/scripts/validate.mjs _release
          rsync -a _release/ _site/ --exclude '.git/' --exclude '.github/' --exclude 'scripts/' --exclude 'README.md' --exclude 'CHANGELOG.md' --exclude 'REPOSITORY_SETUP.md' --exclude 'SECURITY.md'
          node enhancements/inject.mjs _site
          test "$(cat _site/pacefold-experience.txt)" = "21.2.0"
          test "$(grep -o 'data-pacefold-v21="21.2.0"' _site/app/index.html | wc -l)" -eq 2
          test "$(grep -o 'data-pacefold-v21-minimal="21.2.0"' _site/app/index.html | wc -l)" -eq 1
          test "$(grep -o 'data-pacefold-v21-minimal-responsive="21.2.0"' _site/app/index.html | wc -l)" -eq 1
          test -f _site/app/pacefold-v21-minimal.css
          test -f _site/app/pacefold-v21-minimal-responsive.css
          grep -q 'pacefold-v21-minimal-responsive.css' _site/service-worker.js
          grep -q 'revision:21.2.0' _site/service-worker.js
          node --check _site/app/pacefold-v21-refine.js
          node --check _site/app/pacefold-v21-precision.js
          node --check _site/service-worker.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
