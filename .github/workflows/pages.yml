name: Verify and publish Pacefold 25

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pacefold-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Canonical source guard
        run: |
          node scripts/verify-canonical.cjs canonical
          node --check canonical/service-worker.js
          node --check canonical/app/service-worker.js
          node --check canonical/app/pacefold-v25-engine.js
          node --check canonical/app/pacefold-v25-theme-boot.js
          node --check canonical/app/pacefold-v25-preboot.js
          node --check canonical/app/pacefold-v25-core.js
          node --check canonical/app/pacefold-v25-boot.js
          node --check canonical/app/pacefold-v25-recovery.js
          node --check canonical/app/pacefold-v25-private.js
          node --check scripts/v25-coherence-audit.cjs
          node --check scripts/v25-privacy-audit.cjs

      - name: Install browser audit runtime
        run: |
          npm install --prefix /tmp/pacefold-browser-audit playwright@1.61.1
          /tmp/pacefold-browser-audit/node_modules/.bin/playwright install --with-deps chromium

      - name: Full Pacefold 25 browser audit
        run: |
          mkdir -p /tmp/pacefold-25-audit
          timeout 300s env NODE_PATH=/tmp/pacefold-browser-audit/node_modules node scripts/v25-audit.cjs canonical /tmp/pacefold-25-audit

      - name: Pacefold 25 coherence audit
        run: |
          timeout 300s env NODE_PATH=/tmp/pacefold-browser-audit/node_modules node scripts/v25-coherence-audit.cjs canonical /tmp/pacefold-25-audit

      - name: Pacefold 25 privacy and transient Daybook audit
        run: |
          timeout 300s env NODE_PATH=/tmp/pacefold-browser-audit/node_modules node scripts/v25-privacy-audit.cjs canonical /tmp/pacefold-25-audit

      - name: Upload release captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pacefold-25-audit-${{ github.run_id }}
          path: /tmp/pacefold-25-audit/
          if-no-files-found: warn
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify exact canonical payload
        run: node scripts/verify-canonical.cjs canonical

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: canonical

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
