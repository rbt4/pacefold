name: Build, verify and publish Pacefold 27.1

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: read

concurrency:
  group: pacefold-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Build Pacefold bundle
        run: npm run build
      - name: Static and core verification
        run: |
          npm run verify
          node tests/core.mjs
      - name: Install browser audit runtime
        run: |
          npm install --prefix /tmp/pacefold-browser-audit playwright@1.61.1
          /tmp/pacefold-browser-audit/node_modules/.bin/playwright install --with-deps chromium
      - name: Final-form release contract
        run: NODE_PATH=/tmp/pacefold-browser-audit/node_modules timeout 300s node tests/v27-release.cjs _site
      - name: Current-product browser audit
        run: NODE_PATH=/tmp/pacefold-browser-audit/node_modules timeout 300s node tests/browser-audit-current.cjs _site /tmp/pacefold-27-audit
      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pacefold-27-final-audit-${{ github.run_id }}
          path: /tmp/pacefold-27-audit/
          if-no-files-found: warn
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Build exact verified site
        run: |
          npm run build
          npm run verify
          node tests/core.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
