name: Validate Pacefold 23.0.0 interaction restoration

on:
  push:
    branches: [main, agent/pacefold-action-dock-restoration]
  pull_request:
    paths:
      - 'enhancements/**'
      - 'scripts/verify.mjs'
      - '.github/workflows/v21.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pacefold-v23-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stabilization:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Reconstruct verified release
        run: |
          cat release/pacefold-v15.zip.b64.part-* | base64 --decode > /tmp/pacefold-v15.zip
          echo "2fbb5c9b1df8369eddd4a7e1b791d60d6f58b1bf4d51665e288fb88ec9409d2b  /tmp/pacefold-v15.zip" | sha256sum -c -
          mkdir _release
          unzip -q /tmp/pacefold-v15.zip -d _release
          PACEFOLD_DEBUG=1 node _release/scripts/build.mjs _release
          node _release/scripts/validate.mjs _release
      - name: Stabilization source guard
        run: |
          test "$(cat enhancements/VERSION)" = "23.0.0"
          for file in \
            enhancements/pacefold-v21-boot.js \
            enhancements/pacefold-v22-spatial.js \
            enhancements/pacefold-v22-hardening.js \
            enhancements/pacefold-v22-cues.js \
            enhancements/pacefold-v22-daylight.js \
            enhancements/pacefold-v23-stability.js \
            enhancements/pacefold-v23-action-dock.js \
            enhancements/inject.mjs \
            enhancements/inject-v22-hardening.mjs \
            enhancements/inject-v22-daylight.mjs \
            enhancements/inject-v23.mjs \
            enhancements/v23-audit.cjs \
            enhancements/action-dock-audit.cjs \
            scripts/verify.mjs; do node --check "$file"; done
          grep -q "const RELEASE='23.0.0'" enhancements/pacefold-v23-stability.js
          grep -q "const REVISION='action-dock-r1'" enhancements/pacefold-v23-action-dock.js
          grep -q 'window.__PACEFOLD_ACTION_DOCK__' enhancements/pacefold-v23-action-dock.js
          grep -q '.pf23-action-dock' enhancements/pacefold-v23-action-dock.css
          grep -q '@media(forced-colors:active)' enhancements/pacefold-v23-stability.css
          grep -q '@media(max-width:420px) and (max-height:240px)' enhancements/pacefold-v23-action-dock.css
          ! grep -E -q '\.innerHTML[[:space:]]*=' enhancements/pacefold-v22-spatial.js enhancements/pacefold-v22-hardening.js enhancements/pacefold-v22-daylight.js enhancements/pacefold-v23-stability.js enhancements/pacefold-v23-action-dock.js
      - name: Repository verifier
        run: node scripts/verify.mjs
      - name: Inject complete surface
        run: |
          for pass in 1 2; do
            node enhancements/inject.mjs _release
            node enhancements/inject-v22-hardening.mjs _release
            node enhancements/inject-v22-daylight.mjs _release
          done
          node enhancements/inject-v23.mjs _release
          node enhancements/inject-v23.mjs _release
          test "$(cat _release/pacefold-experience.txt)" = "23.0.0"
          test "$(cat _release/pacefold-stability.txt)" = "23.0.0 23.0.0"
          test "$(grep -o 'data-pacefold-v23-boot=\"23.0.0\"' _release/app/index.html | wc -l)" -eq 1
          test "$(grep -o 'data-pacefold-v23-css=\"23.0.0\"' _release/app/index.html | wc -l)" -eq 1
          test "$(grep -o 'data-pacefold-v23-runtime=\"23.0.0\"' _release/app/index.html | wc -l)" -eq 1
          for asset in pacefold-v23-boot.css pacefold-v23.css pacefold-v23.js; do test -f "_release/app/$asset"; grep -q "$asset" _release/service-worker.js; done
          grep -q 'revision:23.0.0' _release/service-worker.js
          grep -q 'build:action-dock-r1' _release/service-worker.js
          grep -q 'window.__PACEFOLD_ACTION_DOCK__' _release/app/pacefold-v23.js
      - name: Install Playwright
        run: |
          npm install --prefix /tmp/pacefold-v23-audit playwright@1.61.1
          /tmp/pacefold-v23-audit/node_modules/.bin/playwright install --with-deps chromium
      - name: Run complete stabilization audit
        run: |
          mkdir -p /tmp/pacefold-v23-artifacts
          NODE_PATH=/tmp/pacefold-v23-audit/node_modules node enhancements/v23-audit.cjs _release /tmp/pacefold-v23-artifacts
      - name: Run quick logging and cue interaction audit
        run: |
          NODE_PATH=/tmp/pacefold-v23-audit/node_modules node enhancements/action-dock-audit.cjs _release /tmp/pacefold-v23-artifacts
      - name: Upload Pacefold 23 captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pacefold-23-action-dock-${{ github.run_id }}
          path: /tmp/pacefold-v23-artifacts/
          if-no-files-found: warn
          retention-days: 7
