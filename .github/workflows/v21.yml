name: Validate Pacefold 21.3 Dayflow experience

on:
  push:
    branches: [main, agent/pacefold-21-3-dayflow]
  pull_request:
    paths:
      - 'enhancements/**'
      - '.github/workflows/v21.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pacefold-21-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-v21:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reconstruct verified release
        run: |
          cat release/pacefold-v15.zip.b64.part-* | base64 --decode > /tmp/pacefold-v15.zip
          echo "2fbb5c9b1df8369eddd4a7e1b791d60d6f58b1bf4d51665e288fb88ec9409d2b  /tmp/pacefold-v15.zip" | sha256sum -c -
          mkdir _release
          unzip -q /tmp/pacefold-v15.zip -d _release
          node _release/scripts/build.mjs _release
          node _release/scripts/validate.mjs _release

      - name: Syntax, privacy and version guard
        run: |
          test "$(cat enhancements/VERSION)" = "21.3.0"
          for file in \
            enhancements/pacefold-v21-boot.js \
            enhancements/pacefold-v21.js \
            enhancements/pacefold-v21-persistence.js \
            enhancements/pacefold-v21-refine.js \
            enhancements/pacefold-v21-precision.js \
            enhancements/v21-audit.cjs \
            enhancements/patch-regression-audits.cjs \
            enhancements/inject.mjs \
            enhancements/inject-v20.mjs; do node --check "$file"; done
          grep -q "const EXPERIENCE='21.3.0'" enhancements/pacefold-v21-precision.js
          grep -q "const REVISION='dayflow-r1'" enhancements/pacefold-v21-precision.js
          grep -q 'pacefold.dayflow.v1' enhancements/pacefold-v21-precision.js
          grep -q '__PACEFOLD_DAYFLOW__' enhancements/pacefold-v21-precision.js
          grep -q 'pf21-dayflow' enhancements/pacefold-v21-dayflow.css
          grep -q 'pf21-daybook' enhancements/pacefold-v21-dayflow.css
          grep -q 'Workday analytics' enhancements/pacefold-v21-precision.js
          ! grep -P '[\x{3040}-\x{30ff}\x{3400}-\x{9fff}]' enhancements/pacefold-v21-dayflow.css enhancements/pacefold-v21-precision.js
          ! grep -E -q '\.innerHTML[[:space:]]*=' enhancements/pacefold-v21-precision.js

      - name: Inject Pacefold 21.3 twice
        run: |
          node enhancements/inject.mjs _release
          node enhancements/inject.mjs _release
          test "$(cat _release/pacefold-experience.txt)" = "21.3.0"
          test "$(grep -o 'data-pacefold-v21=\"21.3.0\"' _release/app/index.html | wc -l)" -eq 2
          test "$(grep -o 'data-pacefold-v21-precision=\"21.3.0\"' _release/app/index.html | wc -l)" -eq 2
          test "$(grep -o 'data-pacefold-v21-dayflow=\"21.3.0\"' _release/app/index.html | wc -l)" -eq 1
          test -f _release/app/pacefold-v21-dayflow.css
          grep -q 'pacefold-v21-dayflow.css' _release/service-worker.js
          grep -q 'pacefold-v21-dayflow.css' _release/app/service-worker.js
          grep -q 'revision:21.3.0' _release/service-worker.js
          node --check _release/app/pacefold-v21-boot.js
          node --check _release/app/pacefold-v21.js
          node --check _release/app/pacefold-v21-persistence.js
          node --check _release/app/pacefold-v21-refine.js
          node --check _release/app/pacefold-v21-precision.js

      - name: Install browser audit runtime
        run: |
          npm install --prefix /tmp/pacefold-v21-audit playwright@1.61.1
          /tmp/pacefold-v21-audit/node_modules/.bin/playwright install --with-deps chromium

      - name: Run Pacefold 21.3 browser audit
        run: |
          mkdir -p /tmp/pacefold-v21-artifacts
          NODE_PATH=/tmp/pacefold-v21-audit/node_modules node enhancements/v21-audit.cjs _release /tmp/pacefold-v21-artifacts

      - name: Upload visual diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pacefold-21.3-dayflow-audit-${{ github.run_id }}
          path: /tmp/pacefold-v21-artifacts/
          if-no-files-found: warn
          retention-days: 7
