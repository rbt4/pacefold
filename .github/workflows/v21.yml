name: Validate Pacefold 22.0.1 Spatial Fold

on:
  push:
    branches: [main, agent/pacefold-22-0-1-hardening]
  pull_request:
    paths:
      - 'enhancements/**'
      - '.github/workflows/v21.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pacefold-v22-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spatial:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Reconstruct verified release
        run: |
          cat release/pacefold-v15.zip.b64.part-* | base64 --decode > /tmp/pacefold-v15.zip
          echo "2fbb5c9b1df8369eddd4a7e1b791d60d6f58b1bf4d51665e288fb88ec9409d2b  /tmp/pacefold-v15.zip" | sha256sum -c -
          mkdir _release
          unzip -q /tmp/pacefold-v15.zip -d _release
          node _release/scripts/build.mjs _release
          node _release/scripts/validate.mjs _release
      - name: Spatial source guard
        run: |
          test "$(cat enhancements/VERSION)" = "22.0.1"
          node --check enhancements/pacefold-v22-spatial.js
          node --check enhancements/pacefold-v22-hardening.js
          node --check enhancements/v21-audit.cjs
          node --check enhancements/inject.mjs
          node --check enhancements/inject-v22-hardening.mjs
          grep -q "const RELEASE='22.0.0'" enhancements/pacefold-v22-spatial.js
          grep -q "const RELEASE='22.0.1'" enhancements/pacefold-v22-hardening.js
          grep -q 'setNotifications' enhancements/pacefold-v22-hardening.js
          grep -q 'openSound' enhancements/pacefold-v22-hardening.js
          ! grep -E -q '\.innerHTML[[:space:]]*=' enhancements/pacefold-v22-spatial.js enhancements/pacefold-v22-hardening.js
      - name: Inject Spatial Fold and hardening twice
        run: |
          node enhancements/inject.mjs _release
          node enhancements/inject-v22-hardening.mjs _release
          node enhancements/inject.mjs _release
          node enhancements/inject-v22-hardening.mjs _release
          test "$(cat _release/pacefold-experience.txt)" = "22.0.1"
          test "$(grep -o 'data-pacefold-v22-spatial=\"22.0.0\"' _release/app/index.html | wc -l)" -eq 2
          test "$(grep -o 'data-pacefold-v22-hardening=\"22.0.1\"' _release/app/index.html | wc -l)" -eq 2
          grep -q 'data-pacefold-spatial="pending"' _release/app/index.html
          grep -q 'pacefold-v22-hardening.css' _release/service-worker.js
          grep -q 'pacefold-v22-hardening.js' _release/service-worker.js
          grep -q 'revision:22.0.1' _release/service-worker.js
      - name: Install Playwright
        run: |
          npm install --prefix /tmp/pacefold-v22-audit playwright@1.61.1
          /tmp/pacefold-v22-audit/node_modules/.bin/playwright install --with-deps chromium
      - name: Run Spatial Fold browser audit
        run: |
          mkdir -p /tmp/pacefold-v22-artifacts
          NODE_PATH=/tmp/pacefold-v22-audit/node_modules node enhancements/v21-audit.cjs _release /tmp/pacefold-v22-artifacts
      - name: Upload Spatial Fold captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pacefold-22.0.1-spatial-audit-${{ github.run_id }}
          path: /tmp/pacefold-v22-artifacts/
          if-no-files-found: warn
          retention-days: 7
