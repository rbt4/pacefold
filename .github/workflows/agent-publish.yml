name: Capture generated Pacefold workflow

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pacefold-workflow-capture
  cancel-in-progress: true

jobs:
  capture:
    if: github.repository == 'rbt4/pacefold' && github.event.pull_request.head.ref == 'agent/pacefold-function-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/pacefold-function-hardening
          fetch-depth: 0
          show-progress: false

      - name: Generate exact production workflow
        run: |
          git show origin/main:.github/workflows/pages.yml > scripts/pages.generated.yml
          old_sha="$(git show origin/main:RELEASE.md | sed -n 's/^- SHA-256: `\([a-f0-9]\{64\}\)`.*/\1/p')"
          new_sha="$(sed -n 's/^- SHA-256: `\([a-f0-9]\{64\}\)`.*/\1/p' RELEASE.md)"
          OLD_SHA="$old_sha" NEW_SHA="$new_sha" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='scripts/pages.generated.yml';
          let source=fs.readFileSync(file,'utf8');
          const replaceExact=(needle,replacement,expected,label)=>{const count=source.split(needle).length-1;if(count!==expected)throw new Error(`${label}: expected ${expected}, found ${count}`);source=source.split(needle).join(replacement);};
          const replaceFirst=(needle,replacement,label)=>{const index=source.indexOf(needle);if(index<0)throw new Error(`${label}: source anchor missing`);source=source.slice(0,index)+replacement+source.slice(index+needle.length);};
          replaceExact(process.env.OLD_SHA,process.env.NEW_SHA,2,'core SHA pins');
          replaceFirst('          node _release/scripts/build.mjs _release','          PACEFOLD_DEBUG=1 node _release/scripts/build.mjs _release','debug audit build');
          replaceExact('          node --check _release/app/pacefold-integrated.js','          node --check _release/app/pacefold-integrated.js\n          ! grep -R -E -q \'\\.innerHTML[[:space:]]*=\' _release/app/app.js _release/app/pacefold-hub.js _release/app/pacefold-hub-guardian.js _release/app/pacefold-resilience.js _release/app/pacefold-integrated.js',1,'validation Trusted Types assertion');
          replaceExact('          node --check _site/app/pacefold-integrated.js','          node --check _site/app/pacefold-integrated.js\n          ! grep -R -E -q \'\\.innerHTML[[:space:]]*=\' _site/app/app.js _site/app/pacefold-hub.js _site/app/pacefold-hub-guardian.js _site/app/pacefold-resilience.js _site/app/pacefold-integrated.js',1,'deploy Trusted Types assertion');
          fs.writeFileSync(file,source);
          NODE
          test "$(grep -o "$new_sha" scripts/pages.generated.yml | wc -l)" -eq 2
          grep -q 'PACEFOLD_DEBUG=1 node _release/scripts/build.mjs _release' scripts/pages.generated.yml

      - name: Publish generated workflow blob
        run: |
          git config user.name pacefold-agent
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/pages.generated.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Capture generated production workflow"
          git push origin HEAD:agent/pacefold-function-hardening
