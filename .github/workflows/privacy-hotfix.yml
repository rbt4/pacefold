name: Pacefold privacy branch hardening

on:
  push:
    branches:
      - agent/pacefold-25-privacy-return

permissions:
  contents: write

jobs:
  harden:
    if: "!contains(github.event.head_commit.message, '[privacy-hotfix]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/pacefold-25-privacy-return
          fetch-depth: 0
      - name: Apply privacy hardening
        run: node scripts/apply-privacy-hotfix.cjs
      - name: Verify syntax and canonical source
        run: |
          node scripts/verify-canonical.cjs canonical
          node --check canonical/app/pacefold-v25-private.js
          node --check scripts/v25-privacy-audit.cjs
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canonical/app/pacefold-v25-private.js canonical/app/pacefold-v25-private.css scripts/v25-privacy-audit.cjs
          git diff --cached --quiet && exit 0
          git commit -m "Harden Pacefold private surface [privacy-hotfix]"
          git push origin HEAD:agent/pacefold-25-privacy-return
