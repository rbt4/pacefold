name: Prepare Pacefold 21.3.1 CI files

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prepare-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v6

      - name: Prepare protected workflow updates
        run: |
          mkdir -p /tmp/pacefold-ci
          cp .github/workflows/pages.yml /tmp/pacefold-ci/pages.yml
          cp .github/workflows/v21.yml /tmp/pacefold-ci/v21.yml
          sed -i 's/21\.3\.0/21.3.1/g; s/dayflow-r1/dayflow-r2/g; s/agent\/pacefold-21-3-dayflow/agent\/pacefold-21-3-1-visual-hotfix/g' /tmp/pacefold-ci/pages.yml /tmp/pacefold-ci/v21.yml

      - name: Upload protected workflow updates
        uses: actions/upload-artifact@v4
        with:
          name: pacefold-21.3.1-ci-files-${{ github.run_id }}
          path: /tmp/pacefold-ci
          retention-days: 2
