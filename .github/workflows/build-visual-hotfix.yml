name: Build Pacefold 21.3.1 visual hotfix

on:
  push:
    branches: [agent/pacefold-21-3-1-visual-hotfix]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v6
        with:
          ref: agent/pacefold-21-3-1-visual-hotfix
          fetch-depth: 0

      - name: Apply visual hotfix
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const read=file=>fs.readFileSync(file,'utf8');
          const write=(file,content)=>fs.writeFileSync(file,content);
          const replace=(file,from,to,label)=>{
            let source=read(file);
            const count=source.split(from).length-1;
            if(count!==1)throw new Error(`${label}: expected one anchor in ${file}, found ${count}`);
            write(file,source.replace(from,to));
          };
          const replaceAll=(file,from,to)=>write(file,read(file).split(from).join(to));

          write('enhancements/VERSION','21.3.1\n');
          replace('enhancements/inject.mjs',"const RELEASE='21.3.0';\nconst REVISION='21.3.0';","const RELEASE='21.3.1';\nconst REVISION='21.3.1';",'inject release revision');
          replace('enhancements/pacefold-v21-dayflow-runtime.part-00.js',"const EXPERIENCE='21.3.0';\nconst RELEASE='21.3.0';\nconst REVISION='dayflow-r1';","const EXPERIENCE='21.3.1';\nconst RELEASE='21.3.1';\nconst REVISION='dayflow-r2';",'Dayflow runtime version');
          replace('enhancements/pacefold-v21-dayflow-runtime.part-01.js',"if(html.dataset.pacefoldDayflow!==REVISION)html.dataset.pacefoldDayflow=REVISION;if(body.dataset.pacefoldExperience!==EXPERIENCE)","if(html.dataset.pacefoldDayflow!==REVISION)html.dataset.pacefoldDayflow=REVISION;const weather=String(prefs().v21WeatherEnabled!==false);if(html.dataset.pf21Weather!==weather)html.dataset.pf21Weather=weather;if(body.dataset.pacefoldExperience!==EXPERIENCE)",'weather layout state');
          replace('enhancements/pacefold-v21-dayflow-runtime.part-03.js',"function renderBook(){const root=book();if(!root)return;const k=","function renderBook(){const root=book();if(!root)return;root.dataset.tab=tab;const k=",'Daybook selected tab state');

          const cssFile='enhancements/pacefold-v21-dayflow.part-04.css';
          let css=read(cssFile);
          const marker='/* Pacefold 21.3.1 visual composition hotfix */';
          if(!css.includes(marker))css+=`\n\n${marker}\nhtml.pf-v21-dayflow-active .pf-v20-folio>.clock-shell{min-height:300px!important}\nhtml[data-pf21-weather="false"].pf-v21-dayflow-active .pf-v20-folio>.clock-shell{grid-template-columns:minmax(0,1fr)!important;grid-template-areas:"brand quiet" "time time" "date date" "status status"!important;column-gap:0!important;min-height:250px!important}\nhtml[data-pf21-weather="false"].pf-v21-dayflow-active .pf-v19-weather{display:none!important}\nhtml.pf-v21-dayflow-active .pf21-dayflow{gap:9px;padding:14px 22px 13px 28px}\nhtml.pf-v21-dayflow-active .pf21-dayflow-title p{max-width:560px}\nhtml.pf-v21-dayflow-active .pf21-flow-stream{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}\nhtml.pf-v21-dayflow-active .pf21-flow-event:nth-child(n+5){display:none}\nhtml.pf-v21-dayflow-active .pf21-flow-event{min-height:42px;padding:6px 7px}\nhtml.pf-v21-dayflow-active .pf21-flow-stat{padding:7px 9px}\nhtml.pf-v21-dayflow-active .pf21-flow-insight{min-height:32px;padding-block:5px}\nhtml.pf-v21-dayflow-active .pf-v20-folio>.pf-v19-workbench{grid-template-rows:minmax(0,1fr) 44px!important;height:clamp(430px,48dvh,540px)!important;min-height:430px!important}\nhtml.pf-v21-dayflow-active .pf-v19-workbench-body{grid-row:1!important;min-height:0!important}\nhtml.pf-v21-dayflow-active .pf-v19-workbench-rail{grid-row:2!important;grid-template-columns:auto minmax(0,1fr) auto!important;min-height:44px!important;padding:6px 12px!important;border-top:1px solid rgba(255,255,255,.09)!important;border-bottom:0!important;color:#edf4f0!important;background:#111a16!important}\nhtml.pf-v21-dayflow-active .pf-v19-workbench-identity{display:none!important}\nhtml.pf-v21-dayflow-active .pf-v19-workbench-tabs{justify-self:start!important;padding:0!important;border:0!important;background:transparent!important}\nhtml.pf-v21-dayflow-active .pf-v19-workbench-tab[data-workbench-page="notes"]{display:none!important}\nhtml.pf-v21-dayflow-active .pf-v19-workbench-tab[data-workbench-page="sound"]{min-width:78px!important;min-height:30px!important;padding:0 12px!important;color:#dce8e2!important;background:rgba(255,255,255,.08)!important}\nhtml.pf-v21-dayflow-active .pf-v19-workbench-tab[data-workbench-page="sound"] small{display:none!important}\nhtml.pf-v21-dayflow-active .pf-v19-workbench-playing{justify-self:end!important;color:#edf4f0!important}\nhtml.pf-v21-dayflow-active .pf-v19-workbench-track strong{color:#edf4f0!important}\nhtml.pf-v21-dayflow-active .pf-v19-workbench-track small{color:#9fb0a8!important}\nhtml.pf-v21-dayflow-active .pf-v20-backup{min-width:178px;color:#edf4f0!important;border-color:rgba(255,255,255,.12)!important;background:rgba(255,255,255,.07)!important}\nhtml.pf-v21-dayflow-active #pf-local-workspace.pf21-daybook-mounted{height:100%!important}\nhtml.pf-v21-dayflow-active .pf21-daybook{height:100%;min-height:0}\nhtml.pf-v21-dayflow-active .pf21-daybook-body{min-height:0;overflow:hidden}\nhtml.pf-v21-dayflow-active .pf21-daybook-nav,html.pf-v21-dayflow-active .pf21-daybook-main,html.pf-v21-dayflow-active .pf21-daybook-side{min-height:0;overflow:auto}\n@media(max-width:760px){\n  html.pf-v21-dayflow-active .pf-v20-folio>.clock-shell{min-height:0!important}\n  html[data-pf21-weather="false"].pf-v21-dayflow-active .pf-v20-folio>.clock-shell{grid-template-areas:"brand" "time" "date" "status"!important;padding-top:18px!important}\n  html.pf-v21-dayflow-active #pf-quiet-toggle{position:absolute!important;top:18px!important;right:18px!important;margin:0!important}\n  html.pf-v21-dayflow-active .pf-v20-alert{position:absolute!important;top:70px!important;right:18px!important;left:auto!important;grid-area:auto!important;justify-self:auto!important;max-width:190px!important;margin:0!important}\n  html.pf-v21-dayflow-active .pf21-dayflow{padding:12px 14px 12px 18px}\n  html.pf-v21-dayflow-active .pf21-dayflow-title p{display:none}\n  html.pf-v21-dayflow-active .pf21-dayflow-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}\n  html.pf-v21-dayflow-active .pf21-open-daybook{display:none!important}\n  html.pf-v21-dayflow-active .pf21-live-badge{grid-column:auto!important;width:100%!important;justify-content:center}\n  html.pf-v21-dayflow-active .pf21-flow-stream{grid-template-columns:repeat(2,minmax(0,1fr))}\n  html.pf-v21-dayflow-active .pf21-flow-event:nth-child(n+3){display:none}\n  html.pf-v21-dayflow-active .pf-v20-folio>.pf-v19-workbench{grid-template-rows:minmax(0,1fr) 42px!important;height:auto!important;min-height:0!important}\n  html.pf-v21-dayflow-active .pf-v19-workbench-rail{min-height:42px!important;padding:5px 8px!important}\n  html.pf-v21-dayflow-active .pf-v19-workbench-playing{display:none!important}\n  html.pf-v21-dayflow-active .pf-v20-backup{min-width:0;max-width:168px}\n  html.pf-v21-dayflow-active #pf-local-workspace.pf21-daybook-mounted,html.pf-v21-dayflow-active .pf21-daybook{height:auto!important}\n  html.pf-v21-dayflow-active .pf21-daybook-body{overflow:visible}\n  html.pf-v21-dayflow-active #pf21-daybook:not([data-tab="calendar"]) .pf21-daybook-nav{display:none!important}\n  html.pf-v21-dayflow-active #pf21-daybook:not([data-tab="insights"]) .pf21-daybook-side{display:none!important}\n  html.pf-v21-dayflow-active .pf21-daybook-main{overflow:visible;padding:14px}\n}\n@media(max-width:430px){\n  html.pf-v21-dayflow-active .pf21-daybook-head{padding:8px 10px}\n  html.pf-v21-dayflow-active .pf21-daybook-tabs{grid-template-columns:repeat(4,minmax(74px,1fr));overflow-x:auto}\n  html.pf-v21-dayflow-active .pf21-daybook-tab{padding-inline:7px}\n}\n`;
          write(cssFile,css);

          for(const file of ['.github/workflows/pages.yml','.github/workflows/v21.yml','enhancements/v21-audit.cjs'])replaceAll(file,'21.3.0','21.3.1');
          replaceAll('.github/workflows/v21.yml','agent/pacefold-21-3-dayflow','agent/pacefold-21-3-1-visual-hotfix');
          replaceAll('enhancements/v21-audit.cjs','dayflow-r1','dayflow-r2');
          replaceAll('enhancements/v21-audit.cjs','initial.dayflow?.height>220','initial.dayflow?.height>150');
          replaceAll('enhancements/v21-audit.cjs','initial.daybook?.height>500','initial.daybook?.height>360');
          fs.rmSync('.github/workflows/build-visual-hotfix.yml');
          NODE

      - name: Commit completed hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Pacefold 21.3.1 visual hotfix [visual-hotfix-built]"
          git push origin HEAD:agent/pacefold-21-3-1-visual-hotfix
