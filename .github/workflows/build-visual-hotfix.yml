name: Build Pacefold 21.3.1 visual hotfix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v6
        with:
          ref: agent/pacefold-21-3-1-visual-hotfix
          fetch-depth: 0

      - name: Apply coordinated app and visual patch
        run: node enhancements/apply-visual-hotfix.cjs

      - name: Commit completed app hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Pacefold 21.3.1 visual hotfix [visual-hotfix-built]"
          git push origin HEAD:agent/pacefold-21-3-1-visual-hotfix
