name: Move private Daybook fold

on:
  push:
    branches:
      - agent/pacefold-25-privacy-return

permissions:
  contents: write

jobs:
  move:
    if: "!contains(github.event.head_commit.message, '[fold-corner]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/pacefold-25-privacy-return
          fetch-depth: 0
      - name: Move private fold
        run: node scripts/move-private-fold-corner.cjs
      - name: Verify source
        run: node scripts/verify-canonical.cjs canonical
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canonical/app/pacefold-v25-private.css
          git diff --cached --quiet && exit 0
          git commit -m "Tuck private Daybook into corner [fold-corner]"
          git push origin HEAD:agent/pacefold-25-privacy-return
