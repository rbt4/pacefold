name: Fix Day Unfold insertion anchor

on:
  push:
    branches:
      - agent/pacefold-25-privacy-return

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[day-unfold-anchor]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/pacefold-25-privacy-return
          fetch-depth: 0
      - name: Repair Day Unfold insertion
        run: node scripts/fix-day-unfold-anchor.cjs
      - name: Verify
        run: |
          node scripts/verify-canonical.cjs canonical
          node --check canonical/app/pacefold-v25-core.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canonical/app/pacefold-v25-core.js
          git diff --cached --quiet && exit 0
          git commit -m "Repair Day Unfold insertion anchor [day-unfold-anchor]"
          git push origin HEAD:agent/pacefold-25-privacy-return
