name: Fix private topbar hit plane

on:
  push:
    branches:
      - agent/pacefold-25-privacy-return

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[private-topbar-hit]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/pacefold-25-privacy-return
          fetch-depth: 0
      - name: Fix topbar hit plane
        run: node scripts/fix-private-topbar-hit.cjs
      - name: Verify source
        run: node scripts/verify-canonical.cjs canonical
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canonical/app/pacefold-v25-private.css
          git diff --cached --quiet && exit 0
          git commit -m "Fix private topbar hit plane [private-topbar-hit]"
          git push origin HEAD:agent/pacefold-25-privacy-return
