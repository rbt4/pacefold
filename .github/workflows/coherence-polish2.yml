name: Pacefold 25 analog geometry correction

on:
  push:
    branches:
      - agent/pacefold-25-coherence

permissions:
  contents: write

jobs:
  correct:
    if: "!contains(github.event.head_commit.message, '[analog-geometry]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: agent/pacefold-25-coherence
          fetch-depth: 0
      - name: Apply analog geometry correction
        run: node scripts/polish2-coherence.cjs
      - name: Verify source
        run: |
          node scripts/verify-canonical.cjs canonical
          node --check scripts/v25-coherence-audit.cjs
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canonical/app/pacefold-v25-recovery.css scripts/v25-coherence-audit.cjs
          git diff --cached --quiet && exit 0
          git commit -m "Fix Pacefold analog tick geometry [analog-geometry]"
          git push origin HEAD:agent/pacefold-25-coherence
