name: Owner-only Pacefold deployment dispatch

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: read

jobs:
  dispatch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.login == github.repository_owner &&
       github.event.issue.title == '[deploy] Pacefold 23.0.0')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch established Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --repo "$GH_REPO" --ref main
