name: Validate Pacefold 18 Ma

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pacefold-ma-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ma:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reconstruct verified core
        run: |
          cat release/pacefold-v15.zip.b64.part-* | base64 --decode > /tmp/pacefold-v15.zip
          echo "2fbb5c9b1df8369eddd4a7e1b791d60d6f58b1bf4d51665e288fb88ec9409d2b  /tmp/pacefold-v15.zip" | sha256sum -c -
          mkdir _release
          unzip -q /tmp/pacefold-v15.zip -d _release

      - name: Syntax and policy floor
        run: |
          test "$(cat enhancements/VERSION)" = "18.0.0"
          node --check enhancements/inject.mjs
          node --check enhancements/pacefold-ma.js
          node --check enhancements/pf-theme-boot.js
          node --check enhancements/ma-audit.cjs
          node --check enhancements/integrated-audit.cjs
          ! grep -R -E -q 'PeriodicSync|NotificationTrigger|periodicSync' enhancements/pacefold-ma.js enhancements/inject.mjs
          ! grep -R -E -q '\.innerHTML[[:space:]]*=' enhancements/pacefold-ma.js enhancements/pf-theme-boot.js
          test ! -e enhancements/pacefold-ma.woff2

      - name: Build and inject twice
        run: |
          node _release/scripts/build.mjs _release
          node _release/scripts/validate.mjs _release
          node enhancements/inject.mjs _release
          node enhancements/inject.mjs _release
          test -f _release/app/pacefold-ma.css
          test -f _release/app/pacefold-ma.js
          test -f _release/app/pf-theme-boot.js
          node --check _release/app/pacefold-ma.js
          node --check _release/app/pf-theme-boot.js
          test "$(grep -o 'pacefold-ma.css?v=18.0.0' _release/app/index.html | wc -l)" -eq 1
          test "$(grep -o 'pacefold-ma.js?v=18.0.0' _release/app/index.html | wc -l)" -eq 1
          test "$(grep -o 'pf-theme-boot.js?v=18.0.0' _release/app/index.html | wc -l)" -eq 1
          test "$(grep -bo 'pf-theme-boot.js' _release/app/index.html | head -1 | cut -d: -f1)" -lt "$(grep -bo 'app.js' _release/app/index.html | head -1 | cut -d: -f1)"
          test "$(grep -bo 'pacefold-ma.js' _release/app/index.html | head -1 | cut -d: -f1)" -lt "$(grep -bo 'app.js' _release/app/index.html | head -1 | cut -d: -f1)"
          grep -R -q 'window-controls-overlay' _release/manifest* _release/app/manifest* 2>/dev/null
          grep -q '__PACEFOLD_MA_ASSETS__' _release/service-worker.js
          grep -q '__PACEFOLD_MA_ASSETS__' _release/app/service-worker.js
          test "$(cat _release/pacefold-build.txt)" = "18.0.0"

      - name: Install browser audit runtime
        run: |
          npm install --prefix /tmp/pacefold-browser-audit playwright@1.61.1
          /tmp/pacefold-browser-audit/node_modules/.bin/playwright install --with-deps chromium

      - name: Ma browser and invariant audit
        run: |
          mkdir -p /tmp/pacefold-ma-artifacts
          NODE_PATH=/tmp/pacefold-browser-audit/node_modules node enhancements/ma-audit.cjs _release /tmp/pacefold-ma-artifacts 2>&1 | tee /tmp/pacefold-ma-audit.log

      - name: Upload Ma diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pacefold-18-ma-audit-${{ github.run_id }}
          path: |
            /tmp/pacefold-ma-audit.log
            /tmp/pacefold-ma-artifacts/
          if-no-files-found: error
          retention-days: 7
